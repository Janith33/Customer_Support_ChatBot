<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Chatbot</title>
    <link rel="stylesheet" href="home.css">
    
</head>
<body>
    <div class="container1">
        <div class="chat-container">
            
            <div class="chat-header1">
                <div class="header-avatar">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <div class="header-info">
                    <h2>Customer Assistant</h2>
                    <span class="status-indicator">
                        <span class="status-dot"></span> Online 24/7 Support
                    </span>
                </div>
            </div>

            <div class="chat-box" id="chatBox">
                <div class="message bot-message">
                    <div class="message-content">
                        Hello! Welcome to <strong>Customer Support</strong>.<br><br>
                        How can I assist you today?
                    </div>
                </div>
            </div>


            <div class="suggestions" id="suggestions">
                <button class="chip" onclick="sendQuickMessage('Fibre packages')">Fibre Packages</button>
                <button class="chip" onclick="sendQuickMessage('How to pay my bill?')">Bill Payment</button>
                <button class="chip" onclick="sendQuickMessage('PEO TV packages')">PEO TV</button>
                <button class="chip" onclick="sendQuickMessage('Router red light issue')">Router Help</button>
                <button class="chip" onclick="sendQuickMessage('Customer hotline')">Hotline</button>
            </div>

            <div class="chat-input-bar">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Type your message here..." 
                    autocomplete="off"
                >
                <button id="sendBtn" class="send-btn" title="Send message">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>


    <script>
        // Support both Flask (5000) and FastAPI (8000) backends
        function determineApiUrl() {
            if (window.location.origin.includes('5000') || window.location.origin.includes('8000')) {
                return '/api/chat';
            }
            // If opened directly from filesystem (file://) or live server
            return 'http://127.0.0.1:5000/api/chat';
        }

        let API_URL = determineApiUrl();

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        let isWaitingForResponse = false;

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatMessageContent(text, sender) {
            if (sender === 'user') {
                return escapeHtml(text).replace(/\n/g, '<br>');
            }
            // For bot messages: escape raw HTML first to prevent XSS, then format markdown
            let safe = escapeHtml(text);
            // Bold **text**
            safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Bullet points
            safe = safe.replace(/^[•*-]\s+(.+)$/gm, '• $1');
            // Line breaks
            safe = safe.replace(/\n/g, '<br>');
            return safe;
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            contentDiv.innerHTML = formatMessageContent(text, sender);

            messageDiv.appendChild(contentDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.classList.add('message', 'bot-message');
            typingDiv.id = 'typingIndicator';

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content', 'typing-indicator');
            contentDiv.innerHTML = '<span></span><span></span><span></span>';

            typingDiv.appendChild(contentDiv);
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isWaitingForResponse) return;

            appendMessage(text, 'user');
            userInput.value = '';
            isWaitingForResponse = true;
            sendBtn.disabled = true;

            showTypingIndicator();

            try {
                let response;
                try {
                    response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });
                } catch (firstErr) {
                    // If port 5000 failed and we are on localhost/file, attempt port 8000 fallback
                    if (API_URL.includes('5000')) {
                        const fallbackUrl = 'http://127.0.0.1:8000/api/chat';
                        response = await fetch(fallbackUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: text })
                        });
                        API_URL = fallbackUrl;
                    } else {
                        throw firstErr;
                    }
                }

                removeTypingIndicator();

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const data = await response.json();
                
                if (data && data.reply) {
                    appendMessage(data.reply, 'bot');
                } else if (data && data.response) {
                    appendMessage(data.response, 'bot');
                } else {
                    appendMessage("Received an empty response from server.", 'bot');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                removeTypingIndicator();
                appendMessage(
                    "⚠️ Unable to connect to the backend server.\n" +
                    "Please ensure either server is running:\n" +
                    "• Flask (default): python Backend/home.py (port 5000)\n" +
                    "• FastAPI (Ollama): python Backend/main.py (port 8000)", 
                    'bot'
                );
            } finally {
                isWaitingForResponse = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function sendQuickMessage(text) {
            if (isWaitingForResponse) return;
            userInput.value = text;
            sendMessage();
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);

        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        });

        // Initial focus
        window.addEventListener('DOMContentLoaded', () => {
            userInput.focus();
        });
    </script>

</body>
</html>
